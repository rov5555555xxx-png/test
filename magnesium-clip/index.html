<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Magnesium Clip</title>
<style>
@font-face{font-family:K;font-weight:700;src:url(fonts/kanit-thai-700-normal.woff2) format("woff2");unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:700;src:url(fonts/kanit-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:K;font-weight:900;src:url(fonts/kanit-thai-900-normal.woff2) format("woff2");unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:900;src:url(fonts/kanit-latin-900-normal.woff2) format("woff2")}
:root{--ink:#1b1b1b;--red:#ef3e36;--blue:#2f6fed;--yellow:#ffd23f;--green:#2bb24c;--purple:#7b5cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:K,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;visibility:hidden;transform-origin:50% 40%}
.grid-pink{background-color:#fbe3ea;background-image:linear-gradient(#e9c3cf 2px,transparent 2px),linear-gradient(90deg,#e9c3cf 2px,transparent 2px);background-size:54px 54px}
.grid-cream{background-color:#f3efe6;background-image:linear-gradient(#ddd6c6 2px,transparent 2px),linear-gradient(90deg,#ddd6c6 2px,transparent 2px);background-size:54px 54px}
.grid-mint{background-color:#e1f2e4;background-image:linear-gradient(#bfdcc5 2px,transparent 2px),linear-gradient(90deg,#bfdcc5 2px,transparent 2px);background-size:54px 54px}
.lined{background-color:#f6efd9;background-image:linear-gradient(90deg,transparent 118px,#f08a8a 118px,#f08a8a 122px,transparent 122px),repeating-linear-gradient(transparent 0 66px,#8aa0e6 66px 69px)}
.night{background-color:#25285a;background-image:linear-gradient(#33377a 2px,transparent 2px),linear-gradient(90deg,#33377a 2px,transparent 2px);background-size:54px 54px}

.abs{position:absolute}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center}
.sticker{filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 10px 8px rgba(0,0,0,.22))}

.tapewrap{filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
.tape{display:block;padding:16px 70px 22px;font-weight:900;font-size:58px;color:#fff;background:var(--c);transform:rotate(var(--r,-2deg));
 clip-path:polygon(0 0,100% 0,97.5% 12%,100% 25%,97.5% 37%,100% 50%,97.5% 62%,100% 75%,97.5% 87%,100% 100%,0 100%,2.5% 87%,0 75%,2.5% 62%,0 50%,2.5% 37%,0 25%,2.5% 12%)}
.big{font-weight:900;line-height:1.25;-webkit-text-stroke:18px var(--ink);paint-order:stroke fill;text-align:center;transform:rotate(var(--r,0deg))}
.chip{display:inline-block;padding:6px 30px 12px;border-radius:18px;font-weight:900;font-size:66px;color:#fff;background:var(--c);border:6px solid #fff;
 box-shadow:0 9px 0 rgba(0,0,0,.22);transform:rotate(var(--r,0deg));white-space:nowrap}
.chip.dark{color:var(--ink)}
.photo{background:#fff;padding:18px 18px 64px;border-radius:12px;box-shadow:0 14px 24px rgba(0,0,0,.25);transform:rotate(var(--r,0deg))}
.photo img{display:block;width:100%;border-radius:6px}
.photo .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:900;font-size:36px;color:var(--ink)}
.card{background:#fff;border:7px solid var(--ink);border-radius:30px;box-shadow:0 14px 0 rgba(0,0,0,.15);padding:26px 30px}
.bubble{padding:10px 28px 16px;border-radius:22px;border:6px solid var(--ink);background:var(--c,#fff);font-weight:900;font-size:46px;color:var(--ink);transform:rotate(var(--r,0deg));white-space:nowrap}

/* animations: every delay is an absolute time on the clip timeline */
.a{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}
.pop{animation-name:pop;animation-duration:.45s}
.drop{animation-name:drop;animation-duration:.5s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s linear both}
@keyframes pop{0%{transform:scale(0) rotate(var(--r,0deg));opacity:0}60%{transform:scale(1.12) rotate(var(--r,0deg));opacity:1}100%{transform:scale(1) rotate(var(--r,0deg))}}
@keyframes drop{0%{transform:translateY(-260px) rotate(var(--r,-2deg))}70%{transform:translateY(14px) rotate(var(--r,-2deg))}100%{transform:translateY(0) rotate(var(--r,-2deg))}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.75) rotate(25deg)}}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(50px,-150px) scale(1.2);opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
@keyframes wiggle{0%,100%{transform:rotate(var(--r,0deg))}50%{transform:rotate(calc(var(--r,0deg) + 3deg))}}
.star{animation:twinkle 1.4s ease-in-out infinite}
.zz{font-weight:900;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;animation:zz 1.8s ease-out infinite}

/* character */
#kid{position:absolute;left:0;bottom:90px;width:410px;z-index:5}
#kid .body{animation:bob 1.6s ease-in-out infinite}
#kid .arm{transform-origin:226px 236px;transform-box:view-box;animation:wave .9s ease-in-out infinite}
#kid .closed{display:none}
#kid.sleep .open{display:none}
#kid.sleep .closed{display:inline}
#kid.sleep .arm{animation:none;transform:rotate(150deg)}

#subs{position:absolute;left:70px;right:40px;bottom:250px;z-index:6}
.phrase{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px 20px;visibility:hidden}
</style>
</head>
<body>
<div id="stage">

<!-- 1: hook -->
<section class="scene grid-pink" data-start="0" data-end="2.9">
  <div class="row" style="top:150px"><div class="tapewrap"><span class="tape a drop" style="--c:var(--red);animation-delay:0s">ตัวช่วยคนนอนไม่หลับ</span></div></div>
  <div class="row" style="top:290px"><div class="big a pop" style="font-size:150px;color:#fff;--r:-3deg;animation-delay:.15s">แมกนีเซียม</div></div>
  <div class="row" style="top:480px"><div class="big a pop" style="font-size:132px;color:var(--yellow);--r:2deg;animation-delay:1.4s">คนนอนไม่หลับ</div></div>
  <div class="abs a pop photo" style="left:470px;top:760px;width:540px;--r:5deg;animation-delay:.45s"><img src="product.jpg"><div class="cap">ตัวนี้เลย!</div></div>
  <div class="abs a pop sticker" style="left:90px;top:770px;width:230px;--r:-10deg;animation-delay:1.6s" data-moon></div>
  <div class="abs zz" style="left:290px;top:760px;font-size:70px;animation-delay:1.7s">Z</div>
  <div class="abs zz" style="left:250px;top:780px;font-size:50px;animation-delay:2.3s">z</div>
  <div data-star="var(--red),120,920,90"></div><div data-star="var(--yellow),90,40,640"></div><div data-star="var(--blue),80,960,1500"></div>
</section>

<!-- 2: 6 hours -->
<section class="scene grid-cream" data-start="2.9" data-end="6.0">
  <div class="row" style="top:150px"><div class="tapewrap"><span class="tape a drop" style="--c:var(--blue);animation-delay:2.9s">ไม่เหมือนตัวทั่วไป</span></div></div>
  <div class="row" style="top:330px"><div class="a pop sticker" style="animation-delay:3.05s">
    <svg width="620" height="620" viewBox="0 0 620 620">
      <circle cx="310" cy="310" r="270" fill="#fff" stroke="#1b1b1b" stroke-width="14"/>
      <path class="draw" pathLength="1" d="M310,80 A230,230 0 0 1 310,540" fill="none" stroke="#2bb24c" stroke-width="56" stroke-linecap="round" style="animation-delay:3.6s;animation-duration:1.9s"/>
      <g id="ticks"></g>
      <g style="transform-origin:310px 310px;animation:spin 1.9s ease-in-out 3.6s both"><line x1="310" y1="310" x2="310" y2="130" stroke="#ef3e36" stroke-width="18" stroke-linecap="round"/></g>
      <circle cx="310" cy="310" r="22" fill="#1b1b1b"/>
    </svg></div></div>
  <div class="row" style="top:900px"><div class="big a pop" style="font-size:120px;color:var(--yellow);--r:-3deg;animation-delay:5.0s">นานถึง 6 ชม.</div></div>
  <div class="abs a pop" style="left:740px;top:280px;--r:10deg;animation-delay:3.7s"><div class="bubble" style="--c:#ffe1ec">ปลดปล่อย<br>ในร่างกาย</div></div>
  <div data-star="var(--green),110,930,110"></div><div data-star="var(--red),80,60,420"></div><div data-star="var(--yellow),90,950,1450"></div>
</section>

<!-- 3: normal magnesium -->
<section class="scene lined" data-start="6.0" data-end="11.3">
  <div class="row" style="top:150px"><div class="tapewrap"><span class="tape a drop" style="--c:var(--yellow);color:var(--ink);animation-delay:6.0s">แมกนีเซียมทั่วไป</span></div></div>
  <div class="abs card a pop" style="left:60px;top:330px;width:960px;--r:-1deg;animation-delay:6.2s">
    <div style="font-weight:900;font-size:46px;color:var(--ink)">ระดับแมกนีเซียมในร่างกาย</div>
    <svg width="896" height="560" viewBox="0 0 896 560" data-axes>
      <path class="draw" pathLength="1" d="M80,460 C130,40 220,30 290,220 S 450,440 830,450" fill="none" stroke="#ef3e36" stroke-width="14" stroke-linecap="round" style="animation-delay:7.6s;animation-duration:3s"/>
    </svg>
  </div>
  <div class="abs a pop" style="left:340px;top:420px;--r:-4deg;animation-delay:8.1s"><div class="bubble" style="--c:var(--yellow)">ช่วงแรกดูดซึมเยอะมาก!</div></div>
  <div class="abs a pop" style="left:470px;top:760px;--r:4deg;animation-delay:9.8s"><div class="bubble" style="--c:#ffd4d1">↓ ไม่กี่ชม. ก็ลดลง</div></div>
  <div data-star="var(--red),110,930,100"></div><div data-star="var(--blue),80,30,1060"></div>
</section>

<!-- 4: this one -->
<section class="scene grid-mint" data-start="11.3" data-end="16.3">
  <div class="row" style="top:140px"><div class="tapewrap"><span class="tape a drop" style="--c:var(--green);font-size:72px;animation-delay:11.3s">แต่ตัวนี้</span></div></div>
  <div class="abs card a pop" style="left:60px;top:330px;width:960px;--r:1deg;animation-delay:11.5s">
    <div style="display:flex;gap:16px;align-items:center;font-weight:900;font-size:38px;color:var(--ink)">
      <span class="chip" style="--c:var(--green);font-size:38px;padding:2px 22px 8px">ตัวนี้</span>
      <span class="chip" style="--c:#b9b9b9;font-size:38px;padding:2px 22px 8px">ตัวทั่วไป</span>
    </div>
    <svg width="896" height="560" viewBox="0 0 896 560" data-axes>
      <path d="M80,460 C130,40 220,30 290,220 S 450,440 830,450" fill="none" stroke="#b9b9b9" stroke-width="10" stroke-dasharray="22 18" stroke-linecap="round"/>
      <path class="draw" pathLength="1" d="M80,460 C110,230 150,190 210,190 L830,190" fill="none" stroke="#2bb24c" stroke-width="16" stroke-linecap="round" style="animation-delay:13.8s;animation-duration:2.2s"/>
    </svg>
  </div>
  <div class="abs a pop photo" style="left:760px;top:110px;width:270px;padding:10px 10px 14px;--r:9deg;animation-delay:12.3s"><img src="product.jpg"></div>
  <div class="abs a pop" style="left:270px;top:1000px;--r:-3deg;animation-delay:14.8s"><div class="bubble" style="--c:#c9f2d2;font-size:54px">ปลดปล่อยเรื่อยๆ 6 ชม.</div></div>
  <div data-star="var(--yellow),100,40,200"></div><div data-star="var(--red),80,960,1480"></div>
</section>

<!-- 5: all night -->
<section class="scene night" data-start="16.3" data-end="99">
  <div class="row" style="top:150px"><div class="tapewrap"><span class="tape a drop" style="--c:var(--purple);animation-delay:16.3s">หลับยาวตลอดคืน</span></div></div>
  <div class="abs a pop sticker" style="left:60px;top:300px;width:260px;--r:-12deg;animation-delay:16.5s" data-moon></div>
  <div class="abs a pop photo" style="left:310px;top:330px;width:560px;--r:-3deg;animation-delay:16.6s"><img src="product.jpg"><div class="cap">Magnesium iCAP</div></div>
  <div class="row" style="top:880px"><div class="big a pop" style="font-size:124px;color:var(--yellow);--r:-2deg;animation-delay:17.6s">นอนยาว ตลอดคืน</div></div>
  <div data-star="#ffd23f,90,900,120"></div><div data-star="#fff,60,960,300"></div><div data-star="#ffd23f,70,40,700"></div><div data-star="#fff,50,960,820"></div><div data-star="#ffd23f,80,960,1480"></div>
</section>

<svg id="kid" viewBox="0 0 300 520" class="sticker">
 <g class="body" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="102" cy="498" rx="42" ry="18" fill="#fff"/><ellipse cx="198" cy="498" rx="42" ry="18" fill="#fff"/>
  <path d="M95,335 L205,335 L210,488 L160,488 L150,390 L140,488 L90,488 Z" fill="#2a2a2a"/>
  <path d="M78,330 L68,236" stroke-width="32"/><path d="M78,330 L68,236" stroke="#ffe0c2" stroke-width="20"/>
  <circle cx="79" cy="338" r="17" fill="#ffe0c2"/>
  <path d="M82,212 Q150,196 218,212 L246,292 L212,300 L210,350 L90,350 L88,300 L54,292 Z" fill="#fff"/>
  <g class="arm"><path d="M226,236 L272,150" stroke-width="32"/><path d="M226,236 L272,150" stroke="#ffe0c2" stroke-width="20"/><circle cx="276" cy="140" r="20" fill="#ffe0c2"/></g>
  <circle cx="72" cy="150" r="17" fill="#ffe0c2"/><circle cx="228" cy="150" r="17" fill="#ffe0c2"/>
  <circle cx="150" cy="140" r="82" fill="#ffe0c2"/>
  <path d="M64,150 Q48,72 104,46 Q122,16 162,28 Q206,18 226,58 Q252,92 236,152 Q226,112 204,102 Q194,122 172,106 Q152,124 130,106 Q110,126 92,110 Q76,124 64,150 Z" fill="#1b1b1b"/>
  <g class="open"><ellipse cx="122" cy="150" rx="7" ry="11" fill="#1b1b1b" stroke="none"/><ellipse cx="178" cy="150" rx="7" ry="11" fill="#1b1b1b" stroke="none"/>
   <path d="M128,180 Q150,212 172,180 Z" fill="#e2574c" stroke-width="5"/></g>
  <g class="closed" fill="none"><path d="M110,152 Q122,162 134,152"/><path d="M166,152 Q178,162 190,152"/><path d="M138,186 Q150,194 162,186"/></g>
  <ellipse cx="108" cy="176" rx="12" ry="7" fill="#ffb3b3" stroke="none"/><ellipse cx="192" cy="176" rx="12" ry="7" fill="#ffb3b3" stroke="none"/>
 </g>
</svg>

<div id="subs"></div>
</div>

<script>
const SUBS = [
 [0.0,1.4,["นี่คือ","แมกนีเซียม"]],
 [1.4,2.9,["สำหรับ","คนนอนไม่หลับ"]],
 [2.9,3.6,["ไม่เหมือน","ตัวทั่วไป"]],
 [3.6,5.0,["เพิ่มการ","ปลดปล่อย","ในร่างกาย"]],
 [5.0,6.0,["ยาวนานถึง","6 ชั่วโมง"]],
 [6.0,7.6,["มันไม่เหมือน","แมกนีเซียมทั่วไปนะ"]],
 [7.6,9.6,["ตัวทั่วไป","ช่วงแรก","ดูดซึมเยอะมาก"]],
 [9.6,10.6,["แล้วจะ","ค่อยๆ ลดลง"]],
 [10.6,11.3,["หลังผ่านไป","ไม่กี่ชั่วโมง"]],
 [11.3,12.5,["แต่","ตัวนี้"]],
 [12.5,13.8,["สำหรับคนที่","นอนไม่ค่อยหลับ"]],
 [13.8,14.8,["ใน","6 ชั่วโมงแรก"]],
 [14.8,16.3,["ปลดปล่อย","แมกนีเซียม","ออกมาเรื่อยๆ"]],
 [16.3,17.6,["ทำให้","แมกนีเซียม","ในร่างกาย"]],
 [17.6,19.5,["ยาวนาน","ตลอดคืน"]],
];
const COLORS=[["var(--blue)",""],["var(--ink)",""],["var(--yellow)","dark"],["var(--red)",""],["var(--green)",""]];
const subs=document.getElementById("subs");
SUBS.forEach(([s,e,words],pi)=>{
  const p=document.createElement("div");p.className="phrase";p.dataset.start=s;p.dataset.end=e;
  words.forEach((w,i)=>{const [c,cls]=COLORS[(pi+i)%COLORS.length];const el=document.createElement("span");
    el.className="chip a pop "+cls;el.textContent=w;el.style.cssText=`--c:${c};--r:${(i%2?2:-2)}deg;animation-delay:${s+i*0.12}s`;p.appendChild(el)});
  subs.appendChild(p);
});

const star=(c,size)=>`<svg width="${size}" height="${size}" viewBox="-50 -50 100 100"><path d="${(()=>{let d="";for(let i=0;i<16;i++){const r=i%2?20:48,a=i*Math.PI/8;d+=(i?"L":"M")+(r*Math.sin(a)).toFixed(1)+","+(-r*Math.cos(a)).toFixed(1)}return d+"Z"})()}" fill="${c}" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/></svg>`;
document.querySelectorAll("[data-star]").forEach((el,i)=>{const [c,s,x,y]=el.dataset.star.split(",");
  el.className="abs star";el.style.cssText=`left:${x}px;top:${y}px;animation-delay:${-i*0.37}s`;el.innerHTML=star(c,+s)});
document.querySelectorAll("[data-moon]").forEach(el=>{el.innerHTML=`<svg viewBox="0 0 200 200" width="100%"><path d="M130,20 A85,85 0 1 0 180,150 A70,70 0 1 1 130,20 Z" fill="#ffd23f" stroke="#1b1b1b" stroke-width="8" stroke-linejoin="round"/><circle cx="70" cy="110" r="8" fill="#e8b92c"/><circle cx="95" cy="150" r="6" fill="#e8b92c"/></svg>`});
document.querySelectorAll("[data-axes]").forEach(svg=>{let g='<g font-family="K" font-weight="700" font-size="32" fill="#1b1b1b">';
  g+='<line x1="80" y1="470" x2="840" y2="470" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/><line x1="80" y1="40" x2="80" y2="470" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>';
  for(let h=0;h<=6;h++){const x=80+h*125;g+=`<line x1="${x}" y1="470" x2="${x}" y2="482" stroke="#1b1b1b" stroke-width="5"/><text x="${x}" y="525" text-anchor="middle">${h}${h==6?" ชม.":""}</text>`}
  svg.insertAdjacentHTML("afterbegin",g+"</g>")});
const ticks=document.getElementById("ticks");
for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=i%3?236:220,r2=252;ticks.insertAdjacentHTML("beforeend",
  `<line x1="${310+r1*Math.sin(a)}" y1="${310-r1*Math.cos(a)}" x2="${310+r2*Math.sin(a)}" y2="${310-r2*Math.cos(a)}" stroke="#1b1b1b" stroke-width="${i%3?6:12}" stroke-linecap="round"/>`)}

const scenes=[...document.querySelectorAll(".scene")],phrases=[...document.querySelectorAll(".phrase")],kid=document.getElementById("kid");
const inWin=(el,t)=>t>=+el.dataset.start&&t<+el.dataset.end;
window.renderAt=t=>{
  for(const a of document.getAnimations()){a.pause();a.currentTime=t*1000}
  for(const s of scenes){const on=inWin(s,t);s.style.visibility=on?"visible":"hidden";
    if(on){const k=Math.min(1,(t-s.dataset.start)/0.22),e=1-Math.pow(1-k,3);s.style.transform=`scale(${1.06-0.06*e})`}}
  for(const p of phrases)p.style.visibility=inWin(p,t)?"visible":"hidden";
  kid.classList.toggle("sleep",t>=16.3);
};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode()))).then(()=>renderAt(0));
</script>
</body>
</html>
